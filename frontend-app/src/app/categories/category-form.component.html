<div class="overlay">
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2 class="form-title">{{ category() ? t('cat.edit') : t('cat.new') }}</h2>

    <label class="field">
      <span class="label">{{ t('cat.name') }} *</span>
      <input formControlName="name" type="text" placeholder="{{ t('cat.name') }}" />
      @if (form.controls.name.invalid && (form.controls.name.dirty || form.controls.name.touched)) {
        <span class="hint error">{{ t('cat.nameRequired') }}</span>
      }
    </label>

    <label class="field">
      <span class="label">{{ t('cat.type') }}</span>
      <select formControlName="type" [disabled]="typeLocked" (change)="typeChanged()">
        <option value="expense">{{ t('cat.expense') }}</option>
        <option value="income">{{ t('cat.income') }}</option>
      </select>
      @if (typeLocked) {
        <span class="hint">
          {{ t('cat.typeLocked') }}
        </span>
      }
    </label>

    @if (showParentField) {
      <label class="field">
        <span class="label">{{ t('cat.parent') }}</span>
        <select formControlName="parent_id" [disabled]="parentLocked">
          <option [ngValue]="null">{{ t('cat.none') }}</option>
          @for (parent of eligibleParents(); track parent.id) {
            <option [ngValue]="parent.id">{{ parent.name }}</option>
          }
        </select>
        @if (parentLocked) {
          <span class="hint">{{ t('cat.parentLocked') }}</span>
        }
      </label>
    }

    <fieldset class="field">
      <span class="label">{{ t('cat.status') }}</span>
      <div class="radio-row">
        <label class="radio">
          <input type="radio" formControlName="status" value="enabled" />
          <span>{{ t('cat.enabled') }}</span>
        </label>
        <label class="radio">
          <input type="radio" formControlName="status" value="disabled" />
          <span>{{ t('cat.disabled') }}</span>
        </label>
      </div>
    </fieldset>

    <div class="grid">
      <label class="field">
        <span class="label">{{ t('cat.icon') }}</span>
        <div class="picker-input">
          <span class="icon-preview">{{ form.controls.icon.value || '🙂' }}</span>
          <input formControlName="icon" type="text" placeholder="{{ t('cat.iconPlaceholder') }}" />
          <button
            type="button"
            class="btn btn-sm picker-toggle"
            (click)="toggleEmojiPicker()"
            [class.active]="emojiPickerOpen()"
          >
            {{ t('cat.iconPick') }}
          </button>
        </div>
        @if (emojiPickerOpen()) {
          <div class="picker-popup emoji-popup" (click)="$event.stopPropagation()">
            <div class="emoji-grid">
              @for (emoji of emojiOptions; track emoji) {
                <button
                  type="button"
                  class="emoji-cell"
                  [class.selected]="form.controls.icon.value === emoji"
                  (click)="selectEmoji(emoji)"
                >
                  {{ emoji }}
                </button>
              }
            </div>
            @if (form.controls.icon.value) {
              <button type="button" class="btn btn-sm" (click)="clearIcon()">{{ t('cat.clear') }}</button>
            }
          </div>
        }
      </label>

      <label class="field">
        <span class="label">{{ t('cat.color') }}</span>
        <div class="picker-input">
          <span class="color-preview" [style.background]="form.controls.color.value || 'transparent'"></span>
          <input formControlName="color" type="text" placeholder="#f59e0b" />
          <button
            type="button"
            class="btn btn-sm picker-toggle"
            (click)="toggleColorPicker()"
            [class.active]="colorPickerOpen()"
          >
            {{ t('cat.colorPick') }}
          </button>
        </div>
        @if (colorPickerOpen()) {
          <div class="picker-popup color-popup" (click)="$event.stopPropagation()">
            <div class="color-grid">
              @for (color of palette; track color) {
                <button
                  type="button"
                  class="color-cell"
                  [style.background]="color"
                  [class.selected]="form.controls.color.value === color"
                  [attr.title]="color"
                  (click)="selectColor(color)"
                ></button>
              }
            </div>
            @if (form.controls.color.value) {
              <button type="button" class="btn btn-sm" (click)="clearColor()">{{ t('cat.clear') }}</button>
            }
          </div>
        }
        <span class="hint">{{ t('cat.colorHint') }}</span>
      </label>

      <label class="field">
        <span class="label">{{ t('cat.displayOrder') }}</span>
        <input formControlName="display_order" type="number" />
      </label>

      <label class="field field-description">
        <span class="label">{{ t('cat.description') }}</span>
        <textarea formControlName="description" rows="2" placeholder="{{ t('cat.description') }}"></textarea>
      </label>
    </div>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <div class="form-actions">
      <button type="button" class="btn" (click)="closed.emit()">{{ t('cat.cancel') }}</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving()">
        {{ saving() ? t('tx.saving') : t('cat.save') }}
      </button>
    </div>
  </form>
</div>
